<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midas Clone Wars RP Loading</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">MIDAS CLONE WARS RP</h1>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
